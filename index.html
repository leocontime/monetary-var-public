<!DOCTYPE html>
<html lang="ko">
<head>

    <title>Monetary VAR Model Analysis Results</title>
    <style>
        body { font-family: "Nanum Gothic", Arial, sans-serif; line-height: 1.6; margin: 20px; }
        h1 { color: #333; }
        img { max-width: 100%; height: auto; display: block; margin: 20px 0; border: 1px solid #ccc; }

<body>
